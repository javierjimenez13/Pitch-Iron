const mon = { type: "lift", title: "Upper Body — Push + Core", warmup: warmups.push, exercises: [

const weekMods = [

function buildWeek(weekIndex, hasMatch) {
  const mod = weekMods[weekIndex];
  const applyDelta = (day) => {
    if (day.type !== "lift") return day;
    return { ...day, exercises: day.exercises.map((e) => {
      if (e.reps === "interval" || typeof e.sets !== "number") return e;
      const newSets = Math.max(2, e.sets + (weekIndex === 2 ? 1 : weekIndex === 3 ? -1 : 0));
      return { ...e, sets: newSets };
    })};
  };
  return [
    applyDelta(mon), applyDelta(tue), ACTIVE_RECOVERY, applyDelta(thu), applyDelta(fri),
    hasMatch ? MATCH_DAY : applyDelta(satConditioning), REST_DAY,
  ].map((d) => ({ ...d, weekLabel: mod.label, weekDetail: mod.detail }));
}
const PROGRAM = [0, 1, 2, 3].map((i) => buildWeek(i, true));

function libLinks(name) {

const LIBRARY = [

  { group: "Upper Pull", items: ["Hoist Lat Pulldown", "Hoist Seated Row", "DB Single-Arm Row", "DB Rear Delt Fly", "Hoist Bicep Curl"] },

function keyFor(week, day, exIdx) { return `pi-w${week}-d${day}-e${exIdx}`; }

/* SPEECH — wrapper around the Web Speech API, tuned to sound less robotic */
let _bestVoice = null;
let _voicesReady = false;
function _pickBestVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const en = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
  const pool = en.length ? en : voices;
  // Prefer higher-quality "Enhanced"/"Premium"/"Neural" voices where the OS offers them,
  // then well-known natural-sounding system voices, then just the first English voice.
  return (
    pool.find((v) => /enhanced|premium|neural/i.test(v.name)) ||
    pool.find((v) => /Samantha|Ava|Nicky|Aaron|Siri/i.test(v.name)) ||
    pool[0]
  );
}
if (typeof window !== "undefined" && "speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    _bestVoice = _pickBestVoice();
    _voicesReady = true;
  };
  _bestVoice = _pickBestVoice();
}
function speak(text, onEnd) {
  try {
    if (!("speechSynthesis" in window)) { onEnd && onEnd(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const voice = _bestVoice || _pickBestVoice();
    if (voice) u.voice = voice;
    u.rate = 0.94;
    u.pitch = 1.02;
    u.volume = 1;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    window.speechSynthesis.speak(u);
  } catch { onEnd && onEnd(); }
}

/* REST TIMER */
function RestTimer({ seconds, onDone }) {
  const [left, setLeft] = useState(seconds);
  const [running, setRunning] = useState(true);
  const ref = useRef(null);

  useEffect(() => {
    if (!running) return;
    ref.current = setInterval(() => {
      setLeft((l) => {
        if (l <= 1) { clearInterval(ref.current); onDone && onDone(); return 0; }
        const next = l - 1;
        if (next <= 5 && next >= 1) speak(String(next));
        return next;
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, [running]);

  const pct = seconds > 0 ? left / seconds : 0;
  const circumference = 2 * Math.PI * 42;
  const dash = circumference * pct;

  return (
    <div className="flex flex-col items-center gap-3 py-4">
      <div className="relative w-28 h-28">
        <svg viewBox="0 0 100 100" className="w-28 h-28 -rotate-90">
          <circle cx="50" cy="50" r="42" fill="none" stroke={C.line} strokeWidth="6" />
          <circle cx="50" cy="50" r="42" fill="none" stroke={C.brass} strokeWidth="6" strokeLinecap="round"
            strokeDasharray={`${dash} ${circumference}`} style={{ transition: "stroke-dasharray 1s linear" }} />
        </svg>
        <div className="absolute inset-0 flex items-center justify-center">
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.text }} className="text-2xl font-semibold">
            {Math.floor(left / 60)}:{String(left % 60).padStart(2, "0")}
          </span>
        </div>
      </div>
      <div className="flex gap-2">
        <button onClick={() => setRunning((r) => !r)} className="px-4 py-2 rounded-full flex items-center gap-1 text-sm" style={{ background: C.surfaceRaised, color: C.text }}>
          {running ? <IPause size={14} /> : <IPlay size={14} />} {running ? "Pause" : "Resume"}
        </button>
        <button onClick={() => setLeft(seconds)} className="px-4 py-2 rounded-full flex items-center gap-1 text-sm" style={{ background: C.surfaceRaised, color: C.text }}>
          <IReset size={14} /> Reset
        </button>
        <button onClick={() => { clearInterval(ref.current); onDone && onDone(); }} className="px-4 py-2 rounded-full text-sm" style={{ background: C.turfDim, color: C.text }}>
          Skip
        </button>
      </div>
    </div>
  );
}

/* EXERCISE CARD — uses localStorage (this file runs standalone, outside Claude) */
function PlankSetTimer({ duration, done, onComplete, onReset }) {
  const [left, setLeft] = useState(duration);
  const [running, setRunning] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!running) return;
    ref.current = setInterval(() => {
      setLeft((l) => {
        if (l <= 1) {
          clearInterval(ref.current);
          setRunning(false);
          onComplete && onComplete();
          return 0;
        }
        return l - 1;
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, [running]);

  const reset = () => {
    clearInterval(ref.current);
    setRunning(false);
    setLeft(duration);
    onReset && onReset();
  };

  return (
    <div className="flex items-center gap-2">
      <span className="flex-1 text-center text-sm py-1.5 rounded-md" style={{ background: C.surfaceRaised, color: done ? C.turf : C.text, fontFamily: "'IBM Plex Mono', monospace" }}>
        {Math.floor(left / 60)}:{String(left % 60).padStart(2, "0")}
      </span>
      {!done && (
        <button onClick={() => setRunning((r) => !r)} className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: C.surfaceRaised }} aria-label={running ? "Pause" : "Start"}>
          {running ? <IPause size={13} color={C.text} /> : <IPlay size={13} color={C.text} />}
        </button>
      )}
      <button onClick={reset} className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: C.surfaceRaised }} aria-label="Reset timer">
        <IReset size={13} color={C.textMuted} />
      </button>
      <button onClick={() => { clearInterval(ref.current); setRunning(false); onComplete && onComplete(); }} className="ml-auto w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
        style={{ background: done ? C.turf : "transparent", border: `1.5px solid ${done ? C.turf : C.line}` }} aria-label={done ? "Set complete" : "Mark set complete"}>
        <ICheck size={14} color={done ? C.bg : C.textFaint} />
      </button>
    </div>
  );
}

/* INTERVAL TIMER — auto-cycles hard/easy phases for the given number of rounds */
function parseIntervalSeconds(name) {
  const m = name.match(/(\d+)s\s*hard\s*\/\s*(\d+)s\s*easy/i);
  return m ? { hardSec: parseInt(m[1], 10), easySec: parseInt(m[2], 10) } : { hardSec: 30, easySec: 60 };
}

function IntervalTimer({ rounds, hardSec, easySec, done, onComplete, onReset }) {
  const totalPhases = rounds * 2;
  const phaseDuration = (idx) => (idx % 2 === 0 ? hardSec : easySec);
  const [state, setState] = useState({ phaseIdx: 0, left: hardSec });
  const [running, setRunning] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!running) return;
    ref.current = setInterval(() => {
      setState((s) => {
        if (s.left <= 1) {
          const nextPhase = s.phaseIdx + 1;
          if (nextPhase >= totalPhases) {
            clearInterval(ref.current);
            setRunning(false);
            onComplete && onComplete();
            return s;
          }
          return { phaseIdx: nextPhase, left: phaseDuration(nextPhase) };
        }
        return { ...s, left: s.left - 1 };
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, [running]);

  const reset = () => {
    clearInterval(ref.current);
    setRunning(false);
    setState({ phaseIdx: 0, left: hardSec });
    onReset && onReset();
  };

  const phase = state.phaseIdx % 2 === 0 ? "hard" : "easy";
  const currentRound = Math.floor(state.phaseIdx / 2) + 1;
  const isHard = phase === "hard";

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center justify-between text-xs" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
        <span style={{ color: C.textFaint }}>Round {Math.min(currentRound, rounds)}/{rounds}</span>
        <span className="px-2 py-0.5 rounded-full font-semibold" style={{ background: isHard ? C.danger : C.turfDim, color: C.text }}>
          {done ? "DONE" : isHard ? "HARD" : "EASY"}
        </span>
      </div>
      <div className="flex items-center gap-2">
        <span className="flex-1 text-center text-sm py-1.5 rounded-md" style={{ background: C.surfaceRaised, color: done ? C.turf : C.text, fontFamily: "'IBM Plex Mono', monospace" }}>
          {Math.floor(state.left / 60)}:{String(state.left % 60).padStart(2, "0")}
        </span>
        {!done && (
          <button onClick={() => setRunning((r) => !r)} className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: C.surfaceRaised }} aria-label={running ? "Pause" : "Start"}>
            {running ? <IPause size={13} color={C.text} /> : <IPlay size={13} color={C.text} />}
          </button>
        )}
        <button onClick={reset} className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: C.surfaceRaised }} aria-label="Reset timer">
          <IReset size={13} color={C.textMuted} />
        </button>
        <button onClick={() => { clearInterval(ref.current); setRunning(false); onComplete && onComplete(); }} className="ml-auto w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
          style={{ background: done ? C.turf : "transparent", border: `1.5px solid ${done ? C.turf : C.line}` }} aria-label={done ? "Set complete" : "Mark set complete"}>
          <ICheck size={14} color={done ? C.bg : C.textFaint} />
        </button>
      </div>
    </div>
  );
}

function ExerciseCard({ weekIdx, dayIdx, exIdx, exercise, onStartRest, isLastExercise, onLastExerciseStatus }) {
  const storageKey = keyFor(weekIdx, dayIdx, exIdx);
  const [sets, setSets] = useState(null);
  const isInterval = exercise.reps === "interval";
  const isPlank = exercise.name.toLowerCase().includes("plank");
  const plankDuration = 45;
  const weightRefs = useRef([]);
  const repsRefs = useRef([]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(storageKey);
      const loaded = raw ? JSON.parse(raw) : Array.from({ length: exercise.sets }, () => ({ weight: "", reps: "", done: false }));
      setSets(loaded);
      if (isLastExercise) onLastExerciseStatus && onLastExerciseStatus(loaded.every((s) => s.done));
    } catch {
      const fallback = Array.from({ length: exercise.sets }, () => ({ weight: "", reps: "", done: false }));
      setSets(fallback);
      if (isLastExercise) onLastExerciseStatus && onLastExerciseStatus(false);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [storageKey, exercise.sets]);

  const persist = useCallback((next) => {
    setSets(next);
    try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch {}
  }, [storageKey]);

  if (!sets) return <div className="rounded-xl p-4 mb-3 animate-pulse" style={{ background: C.surface, height: 72 }} />;

  const updateSet = (i, field, value) => persist(sets.map((s, idx) => (idx === i ? { ...s, [field]: value } : s)));
  const toggleDone = (i, forceValue) => {
    const wasDone = sets[i].done;
    const newDone = forceValue !== undefined ? forceValue : !wasDone;
    const next = sets.map((s, idx) => (idx === i ? { ...s, done: newDone } : s));
    persist(next);
    if (newDone && !wasDone && exercise.rest > 0 && !isLastExercise) onStartRest(exercise.rest, exercise.name);
    if (isLastExercise) onLastExerciseStatus && onLastExerciseStatus(next.every((s) => s.done));
  };
  const allDone = sets.every((s) => s.done);

  return (
    <div className="rounded-xl p-4 mb-3" style={{ background: C.surface, border: `1px solid ${allDone ? C.turfDim : C.line}` }}>
      <div className="flex items-center justify-between mb-2 gap-2">
        <div className="flex items-center gap-2 min-w-0">
          <a href={libLinks(exercise.name).video} target="_blank" rel="noopener noreferrer"
            className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: C.turfDim }}
            aria-label={`Watch ${exercise.name} demo`} onClick={(e) => e.stopPropagation()}>
            <IPlay size={12} color={C.text} />
          </a>
          <h4 className="font-medium truncate" style={{ color: C.text }}>{exercise.name}</h4>
        </div>
        <span className="text-xs px-2 py-0.5 rounded-full flex-shrink-0" style={{ background: C.surfaceRaised, color: C.textMuted, fontFamily: "'IBM Plex Mono', monospace" }}>
          {isPlank ? `${exercise.sets}×${plankDuration}s` : `${exercise.sets}×${exercise.reps}`}
        </span>
      </div>
      {isInterval ? (
        <IntervalTimer
          rounds={exercise.sets}
          hardSec={parseIntervalSeconds(exercise.name).hardSec}
          easySec={parseIntervalSeconds(exercise.name).easySec}
          done={sets[0]?.done}
          onComplete={() => !sets[0]?.done && toggleDone(0)}
          onReset={() => sets[0]?.done && toggleDone(0)}
        />
      ) : isPlank ? (
        <div className="flex flex-col gap-2">
          {sets.map((s, i) => (
            <div key={i} className="flex items-center gap-2">
              <span className="w-5 text-xs text-center flex-shrink-0" style={{ color: C.textFaint, fontFamily: "'IBM Plex Mono', monospace" }}>{i + 1}</span>
              <PlankSetTimer
                duration={plankDuration}
                done={s.done}
                onComplete={() => !s.done && toggleDone(i)}
                onReset={() => s.done && toggleDone(i)}
              />
            </div>
          ))}
        </div>
      ) : (
        <div className="flex flex-col gap-2">
          {sets.map((s, i) => (
            <div key={i} className="flex items-center gap-2">
              <span className="w-5 text-xs text-center" style={{ color: C.textFaint, fontFamily: "'IBM Plex Mono', monospace" }}>{i + 1}</span>
              <input type="number" inputMode="decimal" placeholder="lb" value={s.weight}
                ref={(el) => (weightRefs.current[i] = el)}
                onChange={(e) => updateSet(i, "weight", e.target.value)}
                onBlur={() => { if (s.weight !== "") repsRefs.current[i]?.focus(); }}
                className="w-16 px-2 py-1.5 rounded-md text-sm text-center outline-none" style={{ background: C.surfaceRaised, color: C.text, fontFamily: "'IBM Plex Mono', monospace" }} />
              <span style={{ color: C.textFaint }}>×</span>
              <input type="number" inputMode="numeric" placeholder="reps" value={s.reps}
                ref={(el) => (repsRefs.current[i] = el)}
                onChange={(e) => updateSet(i, "reps", e.target.value)}
                onBlur={() => { if (s.reps !== "") { if (!s.done) toggleDone(i, true); weightRefs.current[i + 1]?.focus(); } }}
                className="w-16 px-2 py-1.5 rounded-md text-sm text-center outline-none" style={{ background: C.surfaceRaised, color: C.text, fontFamily: "'IBM Plex Mono', monospace" }} />
              <button onClick={() => toggleDone(i)} className="ml-auto w-8 h-8 rounded-full flex items-center justify-center"
                style={{ background: s.done ? C.turf : "transparent", border: `1.5px solid ${s.done ? C.turf : C.line}` }} aria-label={s.done ? "Set complete" : "Mark set complete"}>
                <ICheck size={14} color={s.done ? C.bg : C.textFaint} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* MAIN APP */
/* WORKOUT LOG — reads localStorage across all 4 weeks, groups by day, shows top set + gain */
function bestSet(sets) {
  let best = null;
  for (const s of sets) {
    const w = parseFloat(s.weight);
    if (!isNaN(w) && s.reps !== "") {
      if (!best || w > best.weight) best = { weight: w, reps: s.reps };
    }
  }
  return best;
}

function LogView() {
  const [groups, setGroups] = useState(null);

  useEffect(() => {
    const dayGroups = [];
    for (let d = 0; d < 7; d++) {
      const templateDay = PROGRAM[0][d];
      if (templateDay.type !== "lift") continue;
      const entries = templateDay.exercises
        .map((ex, exIdx) => ({ ex, exIdx }))
        .filter(({ ex }) => ex.reps !== "interval" && !ex.name.toLowerCase().includes("plank"));
      if (entries.length === 0) continue;
      const rows = entries.map(({ ex, exIdx }) => {
        const weekBests = [0, 1, 2, 3].map((w) => {
          try {
            const raw = localStorage.getItem(keyFor(w, d, exIdx));
            return raw ? bestSet(JSON.parse(raw)) : null;
          } catch {
            return null;
          }
        });
        const logged = weekBests.filter(Boolean);
        const gain = logged.length >= 2 ? logged[logged.length - 1].weight - logged[0].weight : null;
        return { name: ex.name, weekBests, gain };
      });
      dayGroups.push({ title: templateDay.title, rows });
    }
    setGroups(dayGroups);
  }, []);

  if (!groups) return <div className="flex-1 flex items-center justify-center py-20" style={{ color: C.textFaint }}>Loading…</div>;
  const hasAnyData = groups.some((g) => g.rows.some((r) => r.weekBests.some(Boolean)));

  return (
    <div className="flex-1 overflow-y-auto px-4 py-5" style={{ paddingBottom: "calc(5.5rem + env(safe-area-inset-bottom))" }}>
      <div className="flex items-center justify-center gap-2 mb-1 text-center">
        <ILog size={16} color={C.brass} />
        <h2 style={{ fontFamily: "'Oswald', sans-serif", color: C.text }} className="text-2xl font-medium uppercase">Workout Log</h2>
      </div>
      <p className="text-xs text-center mb-5" style={{ color: C.textMuted }}>Top set per week, and total gain across weeks logged</p>

      {!hasAnyData && (
        <div className="rounded-xl p-5 text-center text-sm" style={{ background: C.surface, color: C.textMuted }}>
          No sets logged yet — data will appear here once you start filling in weight and reps on the Today tab.
        </div>
      )}

      {groups.map((group) => (
        <div key={group.title} className="rounded-xl mb-5 overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="px-4 py-3" style={{ borderBottom: `1px solid ${C.line}`, background: C.surfaceRaised }}>
            <p className="text-xs uppercase tracking-wide font-semibold" style={{ color: C.brass, fontFamily: "'IBM Plex Mono', monospace" }}>{group.title}</p>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full" style={{ borderCollapse: "collapse", fontFamily: "'IBM Plex Mono', monospace" }}>
              <thead>
                <tr>
                  <th className="text-left px-4 py-2 text-[10px] uppercase tracking-wide" style={{ color: C.textFaint }}>Exercise</th>
                  {[1, 2, 3, 4].map((w) => (
                    <th key={w} className="text-center px-2 py-2 text-[10px] uppercase tracking-wide" style={{ color: C.textFaint }}>W{w}</th>
                  ))}
                  <th className="text-center px-3 py-2 text-[10px] uppercase tracking-wide" style={{ color: C.textFaint }}>Gain</th>
                </tr>
              </thead>
              <tbody>
                {group.rows.map((row, i) => (
                  <tr key={row.name} style={{ borderTop: `1px solid ${C.line}`, background: i % 2 === 1 ? "rgba(255,255,255,0.03)" : "transparent" }}>
                    <td className="px-4 py-2.5 text-sm" style={{ color: C.text, maxWidth: 130, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{row.name}</td>
                    {row.weekBests.map((b, wi) => (
                      <td key={wi} className="text-center px-2 py-2.5 text-xs" style={{ color: b ? C.text : C.textFaint }}>
                        {b ? `${b.weight}×${b.reps}` : "—"}
                      </td>
                    ))}
                    <td className="text-center px-3 py-2.5 text-xs font-semibold" style={{ color: row.gain == null ? C.textFaint : row.gain > 0 ? C.turf : row.gain < 0 ? C.danger : C.textMuted }}>
                      {row.gain == null ? "—" : row.gain > 0 ? `+${row.gain}` : row.gain}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [weekIdx, setWeekIdx] = useState(0);
  const [dayIdx, setDayIdx] = useState(0);
  const [restState, setRestState] = useState(null);
  const [tab, setTab] = useState("today");

  const day = PROGRAM[weekIdx][dayIdx];
  const startRest = (seconds, label) => { speak("Recovery"); setRestState({ seconds, label }); };

  // SoundCloud widgets: pump-up track on "Start Workout", finisher track after workout complete
  const startFrameRef = useRef(null);
  const completeFrameRef = useRef(null);
  const scStartRef = useRef(null);
  const scCompleteRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    let poll = null;
    const init = () => {
      if (cancelled) return;
      if (window.SC && startFrameRef.current && completeFrameRef.current) {
        scStartRef.current = window.SC.Widget(startFrameRef.current);
        scCompleteRef.current = window.SC.Widget(completeFrameRef.current);
      } else {
        poll = setTimeout(init, 250);
      }
    };
    init();
    return () => { cancelled = true; if (poll) clearTimeout(poll); };
  }, []);

  const playStartClip = () => { try { scStartRef.current && scStartRef.current.play(); } catch {} };
  const playCompleteClip = () => { try { scCompleteRef.current && scCompleteRef.current.play(); } catch {} };

  const [workoutDone, setWorkoutDone] = useState(false);
  useEffect(() => { setWorkoutDone(false); }, [weekIdx, dayIdx]);

  const changeDay = (delta) => {
    let d = dayIdx + delta, w = weekIdx;
    if (d > 6) { d = 0; w = Math.min(3, w + 1); } else if (d < 0) { d = 6; w = Math.max(0, w - 1); }
    setDayIdx(d); setWeekIdx(w);
  };

  const typeIcon = { lift: <IDumbbell size={16} />, rest: <span style={{ opacity: 0.6 }}>●</span>, recovery: <IWaves size={16} />, match: <IFlame size={16} /> }[day.type];

  return (
    <div className="min-h-screen w-full flex flex-col" style={{ background: "transparent", fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <iframe
        ref={startFrameRef}
        title="start-clip"
        style={{ display: "none" }}
        width="1" height="1"
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fctfletcherofficial%2Fi-am-the-one&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
      ></iframe>
      <iframe
        ref={completeFrameRef}
        title="complete-clip"
        style={{ display: "none" }}
        width="1" height="1"
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fctfletcherofficial%2Ff-ck-average&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
      ></iframe>
      <div className="px-5 pt-6 pb-4" style={{ borderBottom: `1px solid ${C.line}` }}>
        <div className="flex items-start justify-between mb-3">
          <div className="flex flex-col">
            <span style={{ fontFamily: "'Oswald', sans-serif", color: C.text, letterSpacing: "0.02em" }} className="text-3xl font-semibold uppercase leading-tight">Pitch &amp; Iron</span>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.brass, letterSpacing: "0.08em" }} className="text-[11px] uppercase mt-0.5">Fitness for Football</span>
          </div>
          <span className="text-xs px-2 py-1 rounded flex-shrink-0" style={{ background: C.surfaceRaised, color: C.brass, fontFamily: "'IBM Plex Mono', monospace" }}>WEEK {weekIdx + 1}/4</span>
        </div>
        <div className="flex gap-1.5">
          {[0, 1, 2, 3].map((w) => <div key={w} className="h-1.5 flex-1 rounded-full" style={{ background: w <= weekIdx ? C.turf : C.line }} />)}
        </div>
        <p className="text-xs mt-2" style={{ color: C.textMuted }}>{day.weekLabel} — {day.weekDetail}</p>
      </div>

      {tab === "today" && (
        <div className="flex items-center px-3 py-3 gap-1" style={{ borderBottom: `1px solid ${C.line}` }}>
            <button onClick={() => changeDay(-1)} className="p-2" aria-label="Previous day"><IChevL size={18} color={C.textMuted} /></button>
            <div className="flex-1 flex overflow-x-auto gap-1" style={{ scrollbarWidth: "none" }}>
              {DAYS.map((d, i) => {
                const active = i === dayIdx;
                return (
                  <button key={d} onClick={() => setDayIdx(i)} className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap flex-shrink-0"
                    style={{ fontFamily: "'IBM Plex Mono', monospace", background: active ? C.turf : "transparent", color: active ? C.bg : C.textMuted, fontWeight: active ? 600 : 400 }}>
                    {d}
                  </button>
                );
              })}
            </div>
            <button onClick={() => changeDay(1)} className="p-2" aria-label="Next day"><IChevR size={18} color={C.textMuted} /></button>
        </div>
      )}

      {tab === "log" ? (
        <LogView />
      ) : (
        <div className="flex-1 overflow-y-auto px-4 py-5" style={{ paddingBottom: "calc(5.5rem + env(safe-area-inset-bottom))" }}>
            <div className="flex items-center justify-center gap-2 mb-1 text-center">
              <span style={{ color: C.brass }}>{typeIcon}</span>
              <h2 style={{ fontFamily: "'Oswald', sans-serif", color: C.text }} className="text-2xl font-medium uppercase">{day.title}</h2>
            </div>
            {day.type === "rest" && <p className="text-sm mt-4 leading-relaxed" style={{ color: C.textMuted }}>{day.note}</p>}
            {day.type === "recovery" && <div className="rounded-xl p-4 mt-4" style={{ background: C.surface }}><p className="text-sm leading-relaxed" style={{ color: C.textMuted }}>{day.note}</p></div>}
            {day.type === "match" && <div className="rounded-xl p-4 mt-4" style={{ background: C.surface, borderLeft: `3px solid ${C.turf}` }}><p className="text-sm leading-relaxed" style={{ color: C.textMuted }}>{day.note}</p></div>}
            {day.type === "lift" && (
              <>
                <button
                  onClick={playStartClip}
                  className="w-full flex items-center justify-center gap-2 py-3 rounded-xl mt-4 text-sm font-semibold uppercase tracking-wide"
                  style={{ background: C.turf, color: C.bg, fontFamily: "'IBM Plex Mono', monospace" }}
                >
                  <IPlay size={14} color={C.bg} /> Start Workout
                </button>
                <div className="rounded-xl p-4 mt-4 mb-5" style={{ background: C.surface }}>
                  <p className="text-xs uppercase tracking-wide mb-1" style={{ color: C.textFaint }}>Warm-up</p>
                  <p className="text-sm leading-relaxed" style={{ color: C.textMuted }}>{day.warmup}</p>
                </div>
                {day.exercises.map((ex, i) => (
                  <ExerciseCard key={`${weekIdx}-${dayIdx}-${i}-${ex.name}`} weekIdx={weekIdx} dayIdx={dayIdx} exIdx={i} exercise={ex} onStartRest={startRest} isLastExercise={i === day.exercises.length - 1} onLastExerciseStatus={setWorkoutDone} />
                ))}
                {workoutDone && (
                  <button
                    onClick={playCompleteClip}
                    className="w-full flex items-center justify-center gap-2 py-3 rounded-xl mt-2 text-sm font-semibold uppercase tracking-wide"
                    style={{ background: C.brass, color: C.bg, fontFamily: "'IBM Plex Mono', monospace" }}
                  >
                    <ICheck size={14} color={C.bg} /> Workout Complete
                  </button>
                )}
              </>
            )}
          </div>
      )}

      <div className="fixed bottom-0 left-0 right-0 flex justify-center gap-1 py-2 px-4 z-40" style={{ background: C.surfaceRaised, borderTop: `1px solid ${C.line}`, paddingBottom: "calc(0.5rem + env(safe-area-inset-bottom))" }}>
        <button onClick={() => setTab("today")} className="flex-1 max-w-[160px] flex flex-col items-center gap-0.5 py-1.5 rounded-lg" style={{ color: tab === "today" ? C.turf : C.textFaint }}>
          <IDumbbell size={18} />
          <span className="text-[10px] uppercase tracking-wide">Today</span>
        </button>
        <button onClick={() => setTab("log")} className="flex-1 max-w-[160px] flex flex-col items-center gap-0.5 py-1.5 rounded-lg" style={{ color: tab === "log" ? C.turf : C.textFaint }}>
          <ILog size={18} />
          <span className="text-[10px] uppercase tracking-wide">Log</span>
        </button>
      </div>

      {restState && (
        <div className="fixed inset-0 flex items-end justify-center z-50" style={{ background: "rgba(0,0,0,0.5)" }}>
          <div className="w-full max-w-md rounded-t-2xl p-5" style={{ background: C.surfaceRaised, paddingBottom: "calc(1.25rem + env(safe-area-inset-bottom))" }}>
            <p className="text-center text-xs uppercase tracking-wide mb-1" style={{ color: C.textFaint }}>Rest — {restState.label}</p>
            <RestTimer seconds={restState.seconds} onDone={() => setRestState(null)} />
          </div>
        </div>
      )}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#B85C4A;font-family:-apple-system,sans-serif;font-size:14px;text-align:center;padding:24px;">Something failed to load: ' +
    (err && err.message ? err.message : String(err)) +
    '</div>';
}
</script>
</body>
</html>
